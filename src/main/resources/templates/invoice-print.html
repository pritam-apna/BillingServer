<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Print View</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: block;
        }

        .action-bar {
            background: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .invoice-sheet {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            color: #1e293b;
        }

        .invoice-sheet h1, .invoice-sheet h2, .invoice-sheet th {
            color: #0f172a;
        }

        .invoice-sheet .items-table th { border-bottom: 2px solid #e2e8f0; }
        .invoice-sheet .items-table td { border-bottom: 1px solid #e2e8f0; background: transparent; }

        @media print {
            .action-bar { display: none !important; }
            body { background: white !important; margin: 0; padding: 0; }
            .invoice-sheet { box-shadow: none; margin: 0; padding: 0; max-width: 100%; border-radius: 0; }
        }
    </style>
</head>
<body>
    
    <!-- Floating Action Bar -->
    <div class="action-bar">
        <button class="btn-primary" onclick="window.print()" style="background: #10b981;">Print / Save PDF</button>
        <button class="btn-primary" onclick="window.location.href='/new-bill'">Create New Bill</button>
    </div>

    <!-- The physical paper representation -->
    <div class="invoice-sheet" id="invoiceCanvas">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3rem;">
            <div>
                <h1 style="background: none; -webkit-text-fill-color: initial; font-size: 2.5rem; letter-spacing: normal;">INVOICE</h1>
                <p style="color: #64748b; margin-top: 0.5rem;" id="printDate"></p>
                <p style="color: #64748b;" id="printInvoiceId"></p>
            </div>
            <div style="text-align: right;">
                <h2 style="font-size: 1.25rem;">Billed To:</h2>
                <div id="printCustName" style="font-weight: 600; font-size: 1.1rem; margin-top: 0.25rem;"></div>
                <div id="printCustPhone" style="color: #64748b;"></div>
            </div>
        </div>

        <table class="items-table" style="width: 100%; margin-bottom: 2rem;">
            <thead>
                <tr>
                    <th style="padding-left: 0;">Item Description</th>
                    <th>Rate</th>
                    <th>Qty</th>
                    <th style="text-align: right; padding-right: 0;">Amount</th>
                </tr>
            </thead>
            <tbody id="printItemsBody">
            </tbody>
        </table>

        <div style="display: flex; justify-content: flex-end;">
            <div style="width: 300px; display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="flex-between">
                    <span style="color: #64748b;">Subtotal</span>
                    <span id="printSubtotal"></span>
                </div>
                <div class="flex-between">
                    <span style="color: #64748b;">Total Tax</span>
                    <span id="printTax"></span>
                </div>
                <div class="flex-between" style="border-top: 2px solid #e2e8f0; padding-top: 0.75rem; font-size: 1.25rem; font-weight: 700;">
                    <span>Total Due</span>
                    <span id="printGrandTotal"></span>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const targetInvoiceId = /*[[${invoiceId}]]*/ 0;
        /*]]>*/

        document.addEventListener('DOMContentLoaded', async () => {
            const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
            
            try {
                const res = await fetch(`/api/invoices/${targetInvoiceId}`);
                if (!res.ok) {
                    document.getElementById('invoiceCanvas').innerHTML = "<h2>Invoice not found.</h2>";
                    return;
                }
                const data = await res.json();

                document.getElementById('printDate').textContent = `Date: ${new Date(data.dateCreated).toLocaleDateString()}`;
                document.getElementById('printInvoiceId').textContent = `Invoice #${data.id.toString().padStart(6, '0')}`;
                document.getElementById('printCustName').textContent = data.customer.name;
                document.getElementById('printCustPhone').textContent = data.customer.phone;

                const tbody = document.getElementById('printItemsBody');
                data.items.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="padding-left: 0;">${item.product.name}</td>
                        <td>${formatter.format(item.unitPrice)}</td>
                        <td>${item.quantity}</td>
                        <td style="text-align: right; padding-right: 0;">${formatter.format(item.lineTotal)}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('printSubtotal').textContent = formatter.format(data.subtotal);
                document.getElementById('printTax').textContent = formatter.format(data.tax);
                document.getElementById('printGrandTotal').textContent = formatter.format(data.grandTotal);

            } catch (e) {
                console.error("Error drawing print view", e);
            }
        });
    </script>
</body>
</html>
