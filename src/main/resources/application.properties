spring.application.name=billing

# H2 Database Connection (Local file-based so data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/billingdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Thymeleaf cache for local development
spring.thymeleaf.cache=false

# OAuth2 Client Configuration
spring.security.oauth2.client.registration.messaging-client-oidc.provider=auth-server
spring.security.oauth2.client.registration.messaging-client-oidc.client-id=billing-client
spring.security.oauth2.client.registration.messaging-client-oidc.client-secret=secret
spring.security.oauth2.client.registration.messaging-client-oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.messaging-client-oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.messaging-client-oidc.scope=openid,profile,billing.read,billing.write

spring.security.oauth2.client.provider.auth-server.issuer-uri=http://127.0.0.1:9000
spring.security.oauth2.client.provider.auth-server.user-name-attribute=sub

# Inventory Module Integration
# Point this to the InventoryServer address. Change if deployed on a different host/port.
inventory.server.url=http://localhost:8082

# Client Credentials registration so BillingServer can call InventoryServer with a secure JWT
spring.security.oauth2.client.registration.billing-service.provider=auth-server
spring.security.oauth2.client.registration.billing-service.client-id=billing-service
spring.security.oauth2.client.registration.billing-service.client-secret=billing-service-secret
spring.security.oauth2.client.registration.billing-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.billing-service.scope=inventory.read,inventory.write
