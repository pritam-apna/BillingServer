server.port=8082
spring.application.name=inventoryserver

spring.datasource.url=jdbc:h2:file:./data/inventorydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OAuth2 Resource Server - validates JWT Bearer tokens from AuthServer
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:9000

# OAuth2 Client - for standalone UI login
spring.security.oauth2.client.registration.inventory-client.provider=auth-server
spring.security.oauth2.client.registration.inventory-client.client-id=inventory-client
spring.security.oauth2.client.registration.inventory-client.client-secret=inventory-secret
spring.security.oauth2.client.registration.inventory-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.inventory-client.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.inventory-client.scope=openid,profile,email

spring.security.oauth2.client.provider.auth-server.issuer-uri=http://127.0.0.1:9000

spring.security.oauth2.client.provider.auth-server.user-name-attribute=sub

