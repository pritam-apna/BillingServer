name: Java Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build AuthServer
      run: mvn -B clean compile install
      working-directory: AuthServer
      
    - name: Build InventoryServer
      run: mvn -B clean compile install
      working-directory: InventoryServer

    - name: Build billingServer
      run: mvn -B clean compile install
      working-directory: billingServer
